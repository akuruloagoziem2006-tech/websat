<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSat predictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="page">
<header>
  <a class="wordmark" href="/">WebSat</a>
  <nav aria-label="Pages">
    <a href="/">Analyses</a>
    <a href="/predictions.html" aria-current="page">Predictions</a>
    <a href="/due.html">Due soon</a>
    <a href="/compare.html">Compare</a>
  </nav>
</header>
<main>
  <h1>Predictions</h1>
  <p class="lede">Each bar shows a prediction's check window on a 90 day scale. The color shows its verdict so far.</p>
  <div class="toolbar"><button id="refresh" type="button">Refresh</button></div>
  <div id="list"></div>
</main>
</div>
<script src="/client.js"></script>
<script>
async function load() {
  const list = document.getElementById("list");
  list.textContent = "Loading…";
  try {
    const r = await call(OP.PREDICTIONS, 30);
    const count = r.u16();
    list.replaceChildren();
    list.className = "";
    if (!count) {
      list.className = "empty";
      list.textContent = "No predictions yet. The first daily run creates them.";
      return;
    }

    const legend = el("div", "legend");
    [[0, "0"], [1 / 3, "30"], [2 / 3, "60"], [1, "90 days"]].forEach(([at, label]) => {
      const tick = el("span", "", label);
      tick.style.setProperty("--at", at);
      legend.append(tick);
    });
    list.append(legend);

    for (let i = 0; i < count; i++) {
      const id = r.u32();
      const analysisId = r.u32();
      const trend = r.str();
      const forecast = r.str();
      const confidence = r.str();
      const days = r.u16();
      const status = r.str();
      const evidence = r.str();

      const row = el("article", "row");
      row.style.setProperty("--c", STATUS_COLOR[status] || STATUS_COLOR.inconclusive);

      const head = el("div", "row-head");
      head.append(el("h2", "", trend), el("span", "status", status));

      const track = el("div", "track");
      track.setAttribute("aria-hidden", "true");
      const fill = el("div", "fill");
      fill.style.setProperty("--share", Math.min(days, WINDOW_SCALE_DAYS) / WINDOW_SCALE_DAYS);
      track.append(fill);

      row.append(
        head,
        track,
        el("p", "forecast", forecast),
        el("p", "meta", `${days}-day window, ${confidence} confidence, analysis ${analysisId}`),
      );
      if (evidence) row.append(el("p", "evidence", evidence));
      list.append(row);
    }
  } catch (e) {
    showError(list, e);
  }
}
document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
