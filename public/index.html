<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSat history</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #fafafa; color: #222; line-height: 1.5; }
  h1 { font-size: 1.3rem; margin-bottom: 8px; }
  button { padding: 8px 14px; font-size: 1rem; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 12px 0; }
  .meta { font-size: .85rem; color: #666; margin-bottom: 10px; }
  .body p { margin: 8px 0; font-size: .95rem; }
  .body h4 { margin: 14px 0 4px; font-size: 1rem; }
  .body ul { margin: 6px 0; padding-left: 20px; }
  .body li { margin: 6px 0; font-size: .95rem; }
  .empty { color: #666; }
  .error { color: #b00020; }
</style>
</head>
<body>
<h1>WebSat analyses</h1><p><a href="/predictions.html">View predictions</a></p>
<button id="refresh">Refresh</button>
<div id="list"></div>

<script src="/render.js"></script>
<script>
const VERSION = 1, OP_HISTORY = 0x04, OP_OK = 0x80;
const dec = new TextDecoder();

function encodeFrame(opcode, payload = new Uint8Array(0)) {
  const buf = new Uint8Array(6 + payload.length);
  const view = new DataView(buf.buffer);
  view.setUint8(0, VERSION);
  view.setUint8(1, opcode);
  view.setUint32(2, payload.length);
  buf.set(payload, 6);
  return buf;
}

function decodeFrame(bytes) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  if (view.getUint8(0) !== VERSION) throw new Error("unsupported version");
  return { opcode: view.getUint8(1), payload: bytes.subarray(6, 6 + view.getUint32(2)) };
}

class Reader {
  constructor(bytes) {
    this.bytes = bytes;
    this.view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    this.pos = 0;
  }
  u16() { const v = this.view.getUint16(this.pos); this.pos += 2; return v; }
  u32() { const v = this.view.getUint32(this.pos); this.pos += 4; return v; }
  str() {
    const n = this.u16();
    const s = dec.decode(this.bytes.subarray(this.pos, this.pos + n));
    this.pos += n;
    return s;
  }
}

async function load() {
  const list = document.getElementById("list");
  list.textContent = "Loading...";
  try {
    const res = await fetch("/bin", {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: encodeFrame(OP_HISTORY, new Uint8Array([0, 20])),
    });
    const { opcode, payload } = decodeFrame(new Uint8Array(await res.arrayBuffer()));
    if (opcode !== OP_OK) throw new Error(new Reader(payload).str());

    const r = new Reader(payload);
    const count = r.u16();
    list.innerHTML = "";
    list.className = count ? "" : "empty";
    if (!count) { list.textContent = "No analyses yet."; return; }

    for (let i = 0; i < count; i++) {
      const id = r.u32();
      const created = r.str();
      const text = r.str();
      const card = document.createElement("div");
      card.className = "card";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `#${id} · ${created}`;
      const body = document.createElement("div");
      body.className = "body";
      renderText(body, text);
      card.append(meta, body);
      list.append(card);
    }
  } catch (e) {
    list.className = "error";
    list.textContent = "Error: " + e.message;
  }
}

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
