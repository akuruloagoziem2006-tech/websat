<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSat analyses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="page">
<header>
  <a class="wordmark" href="/">WebSat</a>
  <nav aria-label="Pages">
    <a href="/" aria-current="page">Analyses</a>
    <a href="/predictions.html">Predictions</a>
    <a href="/due.html">Due soon</a>
    <a href="/compare.html">Compare</a>
  </nav>
</header>
<main>
  <h1>Analyses</h1>
  <p class="lede">Each daily run summarizes recent technology and AI headlines, then makes dated predictions.</p>
  <div class="toolbar"><button id="refresh" type="button">Refresh</button></div>
  <div id="list"></div>
</main>
</div>
<script src="/render.js"></script>
<script src="/client.js"></script>
<script>
async function load() {
  const list = document.getElementById("list");
  list.textContent = "Loading…";
  try {
    const r = await call(OP.HISTORY, 20);
    const count = r.u16();
    list.replaceChildren();
    list.className = "";
    if (!count) {
      list.className = "empty";
      list.textContent = "No analyses yet. The daily run at 14:00 UTC adds the first one.";
      return;
    }
    for (let i = 0; i < count; i++) {
      const id = r.u32();
      const created = r.str();
      const text = r.str();
      const entry = el("article", "entry");
      const stamp = el("div", "stamp");
      stamp.append(el("span", "", `Analysis ${id}`), el("span", "", formatDate(created)));
      const body = el("div", "body");
      renderText(body, text);
      entry.append(stamp, body);
      list.append(entry);
    }
  } catch (e) {
    showError(list, e);
  }
}
document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
