<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSat compare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page">
<header>
  <a class="wordmark" href="/">WebSat</a>
  <nav aria-label="Pages">
    <a href="/">Analyses</a>
    <a href="/predictions.html">Predictions</a>
    <a href="/due.html">Due soon</a>
    <a href="/compare.html" aria-current="page">Compare</a>
  </nav>
</header>
<main id="main" tabindex="-1">
  <h1>Compare</h1>
  <p class="lede">Each analysis next to the headlines fetched after it, until the next run.</p>
  <div class="toolbar"><button id="refresh" type="button">Refresh</button></div>
  <div id="list" aria-live="polite"></div>
</main>
</div>
<script src="/render.js"></script>
<script src="/client.js"></script>
<script>
async function load() {
  const list = document.getElementById("list");
  list.textContent = "Loading…";
  try {
    const r = await call(OP.COMPARE, 10);
    const count = r.u16();
    list.replaceChildren();
    list.className = "";
    if (!count) {
      list.className = "empty";
      list.textContent = "No analyses yet.";
      return;
    }
    for (let i = 0; i < count; i++) {
      const id = r.u32();
      const created = r.str();
      const summary = r.str();
      const later = r.str();

      const entry = el("article", "entry");
      const stamp = el("div", "stamp");
      stamp.append(el("span", "", `Analysis ${id}`), el("span", "", created));
      const body = el("div", "body");
      renderText(body, summary);
      entry.append(stamp, body);

      const items = later ? later.split(" | ").filter(Boolean) : [];
      entry.append(el("h2", "subhead", `${items.length} headline${items.length === 1 ? "" : "s"} since`));
      if (items.length) {
        const ul = el("ul", "later");
        for (const title of items) ul.append(el("li", "", title));
        entry.append(ul);
      } else {
        entry.append(el("p", "empty", "None yet. The next daily run adds them."));
      }
      list.append(entry);
    }
  } catch (e) {
    showError(list, e);
  }
}
document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
