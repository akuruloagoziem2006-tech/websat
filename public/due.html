<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSat due soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page">
<header>
  <a class="wordmark" href="/">WebSat</a>
  <nav aria-label="Pages">
    <a href="/">Analyses</a>
    <a href="/predictions.html">Predictions</a>
    <a href="/due.html" aria-current="page">Due soon</a>
    <a href="/compare.html">Compare</a>
  </nav>
</header>
<main id="main" tabindex="-1">
  <h1>Due soon</h1>
  <p class="lede">Predictions whose check windows close within the next 7 days.</p>
  <div class="toolbar"><button id="refresh" type="button">Refresh</button></div>
  <div id="list" aria-live="polite"></div>
</main>
</div>
<script src="/client.js"></script>
<script>
async function load() {
  const list = document.getElementById("list");
  list.textContent = "Loading…";
  try {
    const r = await call(OP.DUE_SOON, 30);
    const count = r.u16();
    list.replaceChildren();
    list.className = "";
    if (!count) {
      list.className = "empty";
      list.textContent = "Nothing closes in the next 7 days. Check back as the 30 to 60 day windows near their end.";
      return;
    }
    for (let i = 0; i < count; i++) {
      const id = r.u32();
      const analysisId = r.u32();
      const trend = r.str();
      const forecast = r.str();
      const confidence = r.str();
      const days = r.u16();
      const closes = r.str();
      r.str();

      const row = el("article", "row");
      row.dataset.status = "open";
      row.append(
        el("h2", "", trend),
        el("p", "forecast", forecast),
        el("p", "meta", `Closes ${closes}, ${days}-day window, ${confidence} confidence, analysis ${analysisId}`),
      );
      list.append(row);
    }
  } catch (e) {
    showError(list, e);
  }
}
document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
